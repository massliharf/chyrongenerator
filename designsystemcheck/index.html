<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Protected</title>
    <style>
      :root {
        --bg: #121417;
        --panel: #1d2025;
        --line: #2c3037;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --accent: #1cb0f6;
        --accent-lip: #1899d6;
        --error: #ff6b6b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
      body {
        font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-user-select: none; user-select: none;
        overflow: hidden;
      }
      .gate { min-height: 100%; display: grid; place-items: center; padding: 16px; }
      form {
        width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line);
        border-radius: 16px; padding: 24px; display: grid; gap: 12px;
      }
      h1 { margin: 0; font-size: 18px; }
      p { margin: 0; color: var(--muted); font-size: 13px; }
      input {
        width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
        background: var(--bg); color: var(--text); font: inherit; -webkit-user-select: text; user-select: text;
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
      button {
        padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #fff;
        font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 4px 0 var(--accent-lip);
      }
      button:disabled { opacity: 0.6; cursor: progress; }
      .err { color: var(--error); min-height: 1.2em; }
      .stage { position: fixed; inset: 0; display: none; }
      .stage.on { display: flex; }
      .frame { position: absolute; inset: 0; overflow: hidden; }
      .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
            [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="gate" id="gate" hidden>
      <form id="form" autocomplete="off">
        <h1>Password required</h1>
        <p>This preview is private.</p>
        <input id="pw" type="password" autocomplete="current-password" aria-label="Password" required autofocus />
        <div class="err" id="err" role="alert"></div>
        <button id="go" type="submit">Unlock</button>
      </form>
    </div>
    <div class="stage" id="stage">
      <div class="frame" id="frame"><iframe id="app" title="Preview"></iframe></div>
    </div>
    <script>
      ;(() => {
        const W = 393, H = 852, PAD = 24, SS_KEY = 'dsc-key-v1'
        const $ = (id) => document.getElementById(id)
        const enc = new TextEncoder()
        const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0))
        const b64e = (u8) => { let s = ''; for (const b of u8) s += String.fromCharCode(b); return btoa(s) }
        const ss = {
          get() { try { return JSON.parse(sessionStorage.getItem(SS_KEY) || 'null') } catch { return null } },
          set(v) { try { sessionStorage.setItem(SS_KEY, JSON.stringify(v)) } catch {} },
          del() { try { sessionStorage.removeItem(SS_KEY) } catch {} },
        }

        // Block context menu and save shortcut on the gate (and inside the unlocked frame).
        const block = (doc) => {
          doc.addEventListener('contextmenu', (e) => e.preventDefault(), true)
          doc.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'u' || e.key === 'U')) e.preventDefault()
          }, true)
        }
        block(document)

        let dir = location.pathname
        if (!dir.endsWith('/')) dir = /\.html?$/.test(dir) ? dir.replace(/[^/]*$/, '') : dir + '/'
        let payloadP = null
        const payload = () => (payloadP ||= fetch(dir + 'payload.json', { cache: 'no-store' }).then((r) => {
          if (!r.ok) throw new Error('payload ' + r.status)
          return r.json()
        }))

        async function deriveRaw(password, p) {
          const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits'])
          const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(p.salt), iterations: p.iter }, base, 256)
          return new Uint8Array(bits)
        }
        async function decrypt(raw, p) {
          const key = await crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt'])
          return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(p.iv) }, key, b64d(p.ct))
        }

        function layout() {} // the prototype lays itself out (phone centered, demo panel on the right)

        function show(buf) {
          const url = URL.createObjectURL(new Blob([buf], { type: 'text/html' }))
          const app = $('app')
          app.addEventListener('load', () => {
            URL.revokeObjectURL(url)
            try {
              block(app.contentDocument)
              // no scroll bars inside the demo (it still scrolls)
              const st = app.contentDocument.createElement('style')
              st.textContent = '*{scrollbar-width:none!important;-ms-overflow-style:none!important}*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}'
              app.contentDocument.head.appendChild(st)
            } catch {}
          }, { once: true })
          app.src = url
          $('gate').hidden = true
          $('stage').classList.add('on')
          layout()
        }

        window.addEventListener('resize', layout)
        matchMedia('(max-width: 599px)').addEventListener('change', layout)

        async function tryStored() {
          const saved = ss.get()
          if (!saved) return false
          try {
            const p = await payload()
            if (saved.salt !== p.salt) { ss.del(); return false }
            show(await decrypt(b64d(saved.k), p))
            return true
          } catch { ss.del(); return false }
        }

        $('form').addEventListener('submit', async (e) => {
          e.preventDefault()
          const pw = $('pw').value
          $('err').textContent = ''
          $('go').disabled = true
          $('go').textContent = 'Unlocking…'
          try {
            const p = await payload()
            const raw = await deriveRaw(pw, p)
            let buf
            try { buf = await decrypt(raw, p) } catch { throw new Error('bad') }
            ss.set({ salt: p.salt, k: b64e(raw) })
            $('pw').value = ''
            show(buf)
          } catch (err) {
            $('err').textContent = err.message === 'bad' ? 'Wrong password.' : 'Could not load the preview.'
          } finally {
            $('go').disabled = false
            $('go').textContent = 'Unlock'
          }
        })

        tryStored().then((ok) => { if (!ok) { $('gate').hidden = false; $('pw').focus() } })
      })()
    </script>
  </body>
</html>
