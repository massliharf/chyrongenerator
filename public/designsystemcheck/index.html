<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Savvy mobile prototype</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <!-- The design system's mobile prototype (prototype.html), shown at phone size. -->
    <iframe id="app" title="Mobile prototype"></iframe>
    <script>
      ;(() => {
        const app = document.getElementById('app')
        app.addEventListener('load', () => {
          try {
            const doc = app.contentDocument
            // No scroll bars inside the demo (it still scrolls).
            const st = doc.createElement('style')
            st.textContent =
              '*{scrollbar-width:none!important;-ms-overflow-style:none!important}*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}' +
              // Phone only: no "Full width" option, the shell stays at the phone size.
              '.shell-seg:has([data-view]){display:none!important}'
            doc.head.appendChild(st)
            const lock = () => {
              const sh = app.contentWindow.__SAVVANT_SHELL__
              if (sh) { if (sh.size !== 'phone') sh.setSize('phone') } else setTimeout(lock, 100)
            }
            lock()
          } catch {}
        }, { once: true })
        try { localStorage.setItem('savvant.theme', 'light') } catch {} // the demo always opens in Light
        app.src = 'prototype.html'
      })()
    </script>
  </body>
</html>
